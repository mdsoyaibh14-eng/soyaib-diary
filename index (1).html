<style>
:root{--gap:#1d2a2a;--pg:#fafafa;--card:#fff;--tx:#222;--mu:#8a8a8a;--ac:#2f6b4f;--bd:#e6e6e6;--sh:#f0f0f0;--chip:#ececef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#1e2321;--card:#262c29;--tx:#eee;--mu:#9aa39e;--ac:#5fb58a;--bd:#363d39;--sh:#2b312e;--chip:#323935;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#1e2321;--card:#262c29;--tx:#eee;--mu:#9aa39e;--ac:#5fb58a;--bd:#363d39;--sh:#2b312e;--chip:#323935;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--gap);color:var(--tx);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif}
.pg{background:var(--pg);min-height:100svh;margin:0;padding:34px 18px 90px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:0 2px 12px;border-bottom:1px solid var(--bd);font:700 12px system-ui,sans-serif;letter-spacing:.14em}
.top span:last-child{color:var(--mu);font:400 12px "Noto Sans Bengali",system-ui,sans-serif;letter-spacing:0}
.date{margin:28px 0 22px;background:var(--sh);border-left:4px solid var(--ac);border-radius:16px;padding:22px}
.date b{font-size:30px;font-weight:400;display:block;line-height:1.3}.date small{color:var(--mu);font-size:15px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;min-height:66px}
.f{grid-column:1/-1}
.l{font-size:11px;color:var(--mu);margin-bottom:8px}.v{font-size:16px;line-height:1.6;word-break:break-word}
.chip{display:block;width:fit-content;background:var(--chip);border:1px solid var(--bd);border-radius:22px;padding:7px 14px;margin:0 0 10px;color:var(--tx);text-decoration:none;font:14px system-ui,sans-serif}
.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.r3>div{background:var(--sh);border-radius:12px;padding:12px;font-size:16px}.r3 .l{margin-bottom:6px}
.r2{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}.r2>div:first-child{background:var(--sh);border-radius:12px;padding:12px;font-size:16px;min-height:62px}
.st{display:inline-block;background:var(--chip);border-radius:20px;padding:6px 14px;font-size:14px;min-width:44px;text-align:center}
.ft{margin-top:auto;padding-top:30px;text-align:center;color:var(--mu);font-size:10px;opacity:.7}
.back{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:26px;padding:12px 18px;font:inherit;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.yr{display:flex;gap:10px;margin:22px 0 14px}
.yr button,.ms button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 0}
.yr button{flex:1;font-size:17px}
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}.ms button{font-size:13px;padding:10px 2px}
.on{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}
.mt{font-size:24px;margin:6px 2px 12px}
.wk,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk div{text-align:center;font-size:12px;color:var(--mu);padding-bottom:4px}
.cal div{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;font:16px system-ui,sans-serif;position:relative}
.cal .e{visibility:hidden}.cal .td{border-color:var(--ac);color:var(--ac);font-weight:700}
.cal .dt::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);position:absolute;bottom:6px}
.hint{color:var(--mu);font-size:12px;margin-top:18px;text-align:center}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#bx{background:var(--pg);border-radius:16px;padding:18px;max-width:560px;margin:0 auto}
#bx h3{margin:0 0 14px;font-weight:600;font-size:17px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin-bottom:12px}
.bt{display:flex;gap:10px}.bt button{flex:1;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.bt .p{background:var(--ac);color:#fff;border-color:var(--ac)}
body{background:radial-gradient(ellipse at 50% 0,#14463a 0,#0b1f1d 55%,#050e0d 100%) fixed;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;box-shadow:inset 0 0 22px 2px rgba(60,200,140,.55),inset 0 0 60px 4px rgba(212,175,55,.25);animation:gl 4s ease-in-out infinite alternate}
@keyframes gl{to{box-shadow:inset 0 0 30px 4px rgba(212,175,55,.6),inset 0 0 70px 6px rgba(60,200,140,.3)}}
.pg{background:linear-gradient(160deg,var(--pg),color-mix(in srgb,var(--ac) 9%,var(--pg)) 60%,color-mix(in srgb,#d4af37 8%,var(--pg)))}
.top{border-bottom:1px solid color-mix(in srgb,#d4af37 45%,var(--bd))}
.nm{margin:20px 0 0;text-align:center;padding:16px 10px;border-radius:18px;background:linear-gradient(135deg,#0f3d2e,#1f6b4f 55%,#0f3d2e);color:#fff;box-shadow:0 8px 24px rgba(31,107,79,.45),inset 0 1px 0 rgba(255,255,255,.25),0 0 0 1px rgba(212,175,55,.6)}
.nm small{display:block;font-size:11px;letter-spacing:.25em;color:#e8cf7a;margin-bottom:4px}
.nm b{font:700 22px/1.4 "Hind Siliguri","Noto Sans Bengali",sans-serif;color:#fff;text-shadow:0 0 14px rgba(232,207,122,.65)}
.nm.s{padding:10px;margin:16px 0 0}.nm.s b{font-size:16px}
.date{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 22%,var(--card)),color-mix(in srgb,#d4af37 16%,var(--card)));border-left-color:#d4af37;box-shadow:0 8px 22px rgba(47,107,79,.25),0 0 0 1px color-mix(in srgb,var(--ac) 30%,transparent)}
.c{--a:#2f6b4f;background:linear-gradient(145deg,color-mix(in srgb,var(--a) 16%,var(--card)),var(--card) 75%);border:1px solid color-mix(in srgb,var(--a) 40%,var(--bd));border-top:3px solid var(--a);box-shadow:0 8px 20px color-mix(in srgb,var(--a) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.55)}
.c .l{color:var(--a);font-weight:600}
.k1{--a:#2563eb}.k2{--a:#7c3aed}.k3{--a:#059669}.k4{--a:#0891b2}.k5{--a:#e11d48}.k6{--a:#d97706}.k7{--a:#4f46e5}
.k6 .r3>div:nth-child(1){background:color-mix(in srgb,#2563eb 16%,var(--card))}.k6 .r3>div:nth-child(2){background:color-mix(in srgb,#059669 18%,var(--card))}.k6 .r3>div:nth-child(3){background:color-mix(in srgb,#e11d48 15%,var(--card))}
.k7 .r2>div:first-child{background:color-mix(in srgb,#4f46e5 14%,var(--card))}
.st{background:linear-gradient(135deg,#d4af37,#f0d77a);color:#3b2f00;font-weight:600;box-shadow:0 0 12px rgba(212,175,55,.55)}
.chip{background:linear-gradient(135deg,color-mix(in srgb,#0891b2 20%,var(--card)),var(--card));border-color:color-mix(in srgb,#0891b2 45%,var(--bd));box-shadow:0 3px 10px rgba(8,145,178,.25)}
.on{background:linear-gradient(135deg,#1f6b4f,#2f9a70)!important;box-shadow:0 0 16px rgba(60,200,140,.55)}
.yr button,.ms button{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.mt{font-weight:700;color:var(--ac)}
.cal div{background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 10%,var(--card)),var(--card));box-shadow:0 3px 8px rgba(47,107,79,.15)}
.cal div:nth-child(7n+6){color:#e11d48}
.cal .td{box-shadow:0 0 14px 2px rgba(60,200,140,.65);border:2px solid var(--ac)}
.cal .dt{background:linear-gradient(145deg,color-mix(in srgb,#d4af37 30%,var(--card)),var(--card))}.cal .dt::after{background:#d4af37;box-shadow:0 0 6px #d4af37}
.back{background:linear-gradient(135deg,#1f6b4f,#2f9a70);box-shadow:0 0 18px rgba(60,200,140,.6),0 4px 14px rgba(0,0,0,.3)}
.li{display:flex;gap:12px;align-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--ac) 10%,var(--card)),var(--card));border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 12px rgba(47,107,79,.15)}
.ld{min-width:50px;text-align:center;background:linear-gradient(135deg,#1f6b4f,#2f9a70);color:#fff;border-radius:10px;padding:6px 4px}.ld b{display:block;font-size:20px;font-family:system-ui,sans-serif}.ld small{font-size:11px;color:#e8cf7a}
.lt{min-width:0;word-break:break-word}.lt small{color:var(--mu)}
.bk{width:100%;margin-top:18px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.nav{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
.nav button{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,#1f6b4f,#2f9a70);color:#fff;font-size:24px;line-height:1;box-shadow:0 0 14px rgba(60,200,140,.55),0 4px 12px rgba(0,0,0,.3)}
</style></head><body>
<div id="app"></div>
<div id="ov"><div id="bx"></div></div>
<script>
const KEY='diary:v3',MO=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'],
WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'],WS=['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'],
FS=['time','purpose','auth','phones','addr','total','advance','sum','status'],
LB={time:'সময়',purpose:'প্রোগ্রামের উদ্দেশ্য',auth:'কর্তৃপক্ষ',phones:'যোগাযোগ (কমা বা নতুন লাইনে আলাদা করুন)',addr:'ঠিকানা',total:'মোট (আর্থিক তথ্য)',advance:'এডভান্স',sum:'মোট',status:'অবস্থা'};
const T0=new Date(2026,0,1),TOTAL=1096;
let D={},Y=2026,M=0,cur='';
const $=s=>document.getElementById(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),key=(y,m,d)=>`${y}-${p2(m+1)}-${p2(d)}`;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('diary',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()}catch(e){rej(e)}})}
async function idbSet(k,v){try{const d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function rd(k){let a=null;try{a=localStorage.getItem(k)}catch(e){}const b=await idbGet(k);const pa=a?JSON.parse(a):{},pb=b?JSON.parse(b):{};return Object.keys(pb).length>Object.keys(pa).length?pb:pa}
function save(){const s=JSON.stringify(D);try{localStorage.setItem(KEY,s)}catch(e){}idbSet(KEY,s)}
async function load(){D=await rd(KEY);
 if(!Object.keys(D).length){const o=await rd('diary:v2');for(const i in o){const d=new Date(2026,9,5+Number(i)-1);D[key(d.getFullYear(),d.getMonth(),d.getDate())]=o[i]}if(Object.keys(D).length)save()}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 const t=new Date();if(t.getFullYear()>=2026&&t.getFullYear()<=2028){Y=t.getFullYear();M=t.getMonth()}
 addEventListener('hashchange',route);route()}
function route(){const h=location.hash.slice(1),m=h.match(/^d(\d{4})-(\d\d)-(\d\d)$/);if(m){cur=h.slice(1);showPage()}else showCal();scrollTo(0,0)}
function showCal(){const t=new Date(),tk=key(t.getFullYear(),t.getMonth(),t.getDate()),first=new Date(Y,M,1).getDay(),n=new Date(Y,M+1,0).getDate();
 let c='';for(let i=0;i<first;i++)c+='<div class="e"></div>';
 for(let d=1;d<=n;d++){const k=key(Y,M,d),e=D[k],has=e&&FS.some(f=>e[f]);c+=`<div class="${k===tk?'td ':''}${has?'dt':''}" onclick="location.hash='d${k}'">${d}</div>`}
 $('app').innerHTML=`<section class="pg"><div class="top"><span>PROGRAMME SCHEDULE</span><span>ক্যালেন্ডার</span></div><div class="nm"><small>ডায়েরি</small><b>হাফেজ শোয়াইব হাসান আক্কেলপুরী</b></div>
<div class="yr">${[2026,2027,2028].map(y=>`<button class="${y===Y?'on':''}" onclick="Y=${y};showCal()">${y}</button>`).join('')}</div>
<div class="ms">${MO.map((m,i)=>`<button class="${i===M?'on':''}" onclick="M=${i};showCal()">${m}</button>`).join('')}</div>
<div class="mt">${MO[M]} ${Y}</div><div class="wk">${WS.map(w=>`<div>${w}</div>`).join('')}</div><div class="cal">${c}</div>
${ml()}<div class="hint">তারিখে চাপ দিন • সবুজ বিন্দু = তথ্য দেওয়া আছে</div><button class="bk" onclick="bk()">💾 ব্যাকআপ / রিস্টোর</button></section>`}
function showPage(){const[y,m,d]=cur.split('-').map(Number),dd=new Date(y,m-1,d),e=D[cur]||{},ph=(e.phones||'').split(/[,\n]+/).map(s=>s.trim()).filter(Boolean),
 x=v=>esc(v)||'—',due=(e.total!==''&&e.total!=null)?(Number(e.total)||0)-(Number(e.advance)||0):'—',n=Math.round((dd-T0)/864e5)+1;
 $('app').innerHTML=`<section class="pg" onclick="ed()">
<div class="top"><span>PROGRAMME SCHEDULE</span><span>দিন ${n} / ${TOTAL}</span></div><div class="nm s"><b>হাফেজ শোয়াইব হাসান আক্কেলপুরী</b></div>
<div class="date"><b>${d} ${MO[m-1]} ${y}</b><small>${WD[dd.getDay()]}</small></div>
<div class="g"><div class="c k1"><div class="l">সময়</div><div class="v">${x(e.time)}</div></div>
<div class="c k2"><div class="l">প্রোগ্রামের উদ্দেশ্য</div><div class="v">${x(e.purpose)}</div></div>
<div class="c k3"><div class="l">কর্তৃপক্ষ</div><div class="v">${x(e.auth)}</div></div>
<div class="c k4"><div class="l">যোগাযোগ</div>${ph.map(p=>`<a class="chip" onclick="event.stopPropagation()" href="tel:+${p.replace(/\D/g,'')}">☎ ${esc(p)}</a>`).join('')||'<div class="v">—</div>'}</div>
<div class="c f k5"><div class="l">ঠিকানা</div><div class="v">${x(e.addr)}</div></div></div>
<div class="c k6" style="margin-bottom:14px"><div class="l">আর্থিক তথ্য</div><div class="r3"><div><div class="l">মোট</div>${x(e.total)}</div><div><div class="l">এডভান্স</div>${x(e.advance)}</div><div><div class="l">বকেয়া</div>${due}</div></div></div>
<div class="c k7"><div class="r2"><div><div class="l">মোট</div>${x(e.sum)}</div><div><div class="l">অবস্থা</div><span class="st">${x(e.status)}</span></div></div></div>
<div class="ft">আপনার ডায়েরি • শুধু এই ফোনে সংরক্ষিত</div></section>
<button class="back" onclick="event.stopPropagation();Y=${y};M=${m-1};location.hash='cal'">📅 ক্যালেন্ডার</button><div class="nav"><button onclick="event.stopPropagation();nd(-1)">‹</button><button onclick="event.stopPropagation();nd(1)">›</button></div>`}
function ed(){const e=D[cur]||{};
 $('bx').innerHTML=`<h3>${cur.split('-')[2]*1} ${MO[cur.split('-')[1]-1]} ${cur.split('-')[0]}</h3>`+FS.map(k=>k==='phones'||k==='addr'?`<label>${LB[k]}</label><textarea id="f_${k}" rows="${k==='phones'?3:2}">${esc(e[k])}</textarea>`:`<label>${LB[k]}</label><input id="f_${k}" ${k==='total'||k==='advance'?'type="number" inputmode="numeric"':''} value="${esc(e[k])}">`).join('')+`<div class="bt"><button onclick="cl()">বাতিল</button><button class="p" onclick="sv()">সংরক্ষণ</button></div>`;
 $('ov').style.display='block';document.body.style.overflow='hidden'}
function cl(){$('ov').style.display='none';document.body.style.overflow=''}
function sv(){const e={};FS.forEach(k=>e[k]=$('f_'+k).value.trim());if(FS.some(k=>e[k]))D[cur]=e;else delete D[cur];save();cl();showPage()}
function ml(){const n=new Date(Y,M+1,0).getDate();let h='';
 for(let d=1;d<=n;d++){const k=key(Y,M,d),e=D[k];
  if(e&&FS.some(f=>e[f]))h+=`<div class="li" onclick="location.hash='d${k}'"><div class="ld"><b>${d}</b><small>${WS[new Date(Y,M,d).getDay()]}</small></div><div class="lt"><div>${esc(e.purpose)||esc(e.auth)||'—'}</div><small>${esc(e.time)} ${esc(e.addr)}</small></div></div>`}
 return `<div class="mt" style="font-size:17px;margin-top:22px">এই মাসের প্রোগ্রাম</div>`+(h||'<div class="hint" style="margin-top:6px">এই মাসে এখনও কোনো প্রোগ্রাম নেই</div>')}
function nd(n){const[y,m,d]=cur.split('-').map(Number),t=new Date(y,m-1,d+n);location.hash='d'+key(t.getFullYear(),t.getMonth(),t.getDate())}
function bk(){$('bx').innerHTML=`<h3>ব্যাকআপ / রিস্টোর</h3><label>আপনার সব ডাটা। কপি করে নিরাপদ জায়গায় রাখুন (যেমন নিজেকে Telegram/WhatsApp-এ পাঠান)। ফোন পাল্টালে বা ডাটা গেলে এখানে পেস্ট করে রিস্টোর করুন।</label><textarea id="bk_t" rows="8">${esc(JSON.stringify(D))}</textarea><div class="bt" style="margin-bottom:12px"><button onclick="bcopy(this)">কপি করুন</button><button class="p" onclick="brest(this)">এই লেখা থেকে রিস্টোর</button></div><div class="bt"><button onclick="cl()">বন্ধ করুন</button></div>`;$('ov').style.display='block';document.body.style.overflow='hidden'}
function bcopy(b){const t=$('bk_t');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(x){}}b.textContent='কপি হয়েছে ✅'}
function brest(b){try{const o=JSON.parse($('bk_t').value);if(!o||typeof o!=='object'||Array.isArray(o))throw 0;D=Object.assign({},D,o);save();cl();route()}catch(e){b.textContent='ভুল ডাটা ❌'}}
load();
</script></body></html>
